<script>
  /**
   * Getty AAT autocomplete via SPARQL (English only)
   * Documentation: https://bootstrap-autocomplete.readthedocs.io/en/latest/
   * Endpoint: https://vocab.getty.edu/sparql
  */
  (function() {
    const $input = $('input[data-reference-system={{ system.id }}]');
    $input.autoComplete({
      bootstrapVersion: '4',
      minLength: 3,
      resolver: 'custom',
      formatResult: function (item) {
        const id = item.id && item.id.value
          ? item.id.value
          : item.subject.value.split('/').pop();
        const label = item.label && item.label.value ? item.label.value : id;
        const scopeNote = item.scopeNote && item.scopeNote.value
          ? item.scopeNote.value
          : '';

        return {
           value: id,
           text: `<strong>${label}</strong> - <small>${id}</small>${scopeNote ? `<br><small class="text-muted">${scopeNote}</small>` : ''}`
        };
      },
      events: {
        search: (function() {
          let timeout;
          return function (qry, callback) {
            clearTimeout(timeout);
            timeout = setTimeout(function() {
              const safeQry = qry
                .replace(/\\/g, '\\\\')
                .replace(/"/g, '\\"');

              const sparqlQuery = `
                PREFIX aat: <http://vocab.getty.edu/aat/>
                PREFIX gvp: <http://vocab.getty.edu/ontology#>
                PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
                PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
                PREFIX xl: <http://www.w3.org/2008/05/skos-xl#>

                SELECT ?subject ?id ?label ?scopeNote WHERE {
                  ?subject skos:prefLabel ?label .
                  BIND(REPLACE(STR(?subject), "^.*/", "") AS ?id)
                  FILTER (lang(?label) = "en")
                  FILTER (regex(?label, "${safeQry}", "i"))
                  OPTIONAL {
                    ?subject skos:scopeNote [rdfs:label ?scopeNote]
                    FILTER (lang(?scopeNote) = "en")
                  }
                } LIMIT 10
              `;

              $.ajax({
                url: "https://vocab.getty.edu/sparql",
                headers: {
                  "Accept": "application/sparql-results+json"
                },
                data: {
                  query: sparqlQuery,
                  format: "json"
                },
                dataType: "json"
              }).done(function(data) {
                if (data && data.results && data.results.bindings) {
                  callback(data.results.bindings);
                } else {
                  callback([]);
                }
              }).fail(function() {
                callback([]);
              });
            }, 400);
          };
        })()
      }
    }).on('autocomplete.select', function(evt, item) {
      $input.val(item.id && item.id.value ? item.id.value : item.value);
    });
  })();
</script>
