<script>
  /**
   * Getty AAT autocomplete via SPARQL (English only)
   * Documentation: https://bootstrap-autocomplete.readthedocs.io/en/latest/
   * Endpoint: https://vocab.getty.edu/sparql
  */
  (function() {
    const $input = $('input[data-reference-system={{ system.id }}]');
    $input.autoComplete({
      bootstrapVersion: '4',
      minLength: 3,
      resolver: 'custom',
      formatResult: function (item) {
        const id = item.id && item.id.value
          ? item.id.value
          : item.subject.value.split('/').pop();
        const label = item.label && item.label.value ? item.label.value : id;
        const scopeNote = item.scopeNote && item.scopeNote.value
          ? item.scopeNote.value
          : '';

        return {
           value: id,
           text: `<strong>${label}</strong> - <small>${id}</small>${scopeNote ? `<br><small class="text-muted">${scopeNote}</small>` : ''}`
        };
      },
      events: {
        search: (function() {
          let timeout;
          return function (qry, callback) {
            clearTimeout(timeout);
            timeout = setTimeout(function() {
              $.ajax({
                url: "/proxy/gettyaat",
                data: { search: qry },
                dataType: "json"
              }).done(function(data) {
                if (Array.isArray(data)) {
                  callback(data);
                } else {
                  callback([]);
                }
              }).fail(function() {
                callback([]);
              });
            }, 400);
          };
        })()
      }
    }).on('autocomplete.select', function(evt, item) {
      $input.val(item.id && item.id.value ? item.id.value : item.value);
    });
  })();
</script>
