<script>
  /**
   * VIAF autocomplete
   */
  initReferenceAutocomplete('{{ system.id }}', {
    search: query => $.ajax({
      url: '/proxy/viaf',
      dataType: 'json',
      data: {query: query}
    }).then(data => (data?.result || []).map(item => ({
      id: item.viafid,
      label: item.term
    })))
  });
</script>
