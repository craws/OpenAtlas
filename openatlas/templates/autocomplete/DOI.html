<script>
  /**
   * DOI (Crossref) autocomplete
   * API: https://api.crossref.org/swagger-ui/index.html
   */
  initReferenceAutocomplete('{{ system.id }}', {
    minLength: 3,
    delay: 400,
    search: query => $.ajax({
      url: '/proxy/crossref',
      dataType: 'json',
      data: {query: query, rows: 60}
    }).then(data => (data?.message?.items || []).map(item => {
      const authors = (item.author || []).map(a => a.family).filter(Boolean);
      const year = item.issued?.['date-parts']?.[0]?.[0];
      return {
        id: item.DOI,
        label: item.title?.[0] || 'No title',
        info: [authors.join(', '), year].filter(Boolean).join(', ')
      };
    }))
  });
</script>
