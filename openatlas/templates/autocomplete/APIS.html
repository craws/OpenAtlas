<script>
  /**
   * APIS autocomplete
   */
  initReferenceAutocomplete('{{ system.id }}', {
    minLength: 3,
    search: query => $.ajax({
      url: '/proxy/apis',
      dataType: 'json',
      data: {search: query, system_url: '{{ system.website_url }}'}
    }).then(data => (Array.isArray(data) ? data : []).map(item => ({
      id: (item.uri || '').split('?')[0].replace(/\/+$/, '').split('/').pop(),
      label: item.name
    })))
  });
</script>
