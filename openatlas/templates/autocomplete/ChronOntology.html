<script>
  /**
   * iDAI.chronontology autocomplete
   * API: https://chronontology.dainst.org/info/api
   */
  (function () {
    function getLabel(resource, id) {
      return resource.names?.en?.[0] || resource.names?.de?.[0] || id;
    }

    function getTimeInfo(resource) {
      const timespan = resource.hasTimespan?.[0];
      if (!timespan) return '';
      const begin = timespan.begin?.at || '?';
      const end = timespan.end?.at || '?';
      return (begin !== '?' || end !== '?') ? `${begin} — ${end}` : '';
    }

    function getDescription(resource) {
      const description = resource.description || '';
      return description.length > 150
        ? description.substring(0, 150) + '...'
        : description;
    }

    function getGazetteerName(item, resource) {
      const related = item.related || resource.related || {};
      for (const key in related) {
        if (!key.includes('gazetteer.dainst.org')) continue;
        const place = related[key];
        const engName = Array.isArray(place.names)
          ? place.names.find(name => name.language === 'eng' && name.title)
          : null;
        if (engName) return engName.title;
        if (place.prefName?.title) return place.prefName.title;
      }
      return '';
    }

    initReferenceAutocomplete('{{ system.id }}', {
      minLength: 3,
      delay: 400,
      search: query => $.ajax({
        url: '/proxy/chronontology',
        dataType: 'json',
        data: {q: query + '*', size: 40}
      }).then(data => (data?.results || []).map(item => {
        const resource = item.resource || {};
        const id = (resource.id || '').split('/').pop();
        return {
          id: id,
          label: getLabel(resource, id),
          info: getGazetteerName(item, resource),
          detail: [getTimeInfo(resource), getDescription(resource)]
            .filter(Boolean).join(' - ')
        };
      }))
    });
  })();
</script>
