<script>
  /**
   * OpenAtlas autocomplete
   * API: {{ system.website_url }}/api/search/all
   */
  initReferenceAutocomplete('{{ system.id }}', {
    search: query => $.ajax({
      url: '{{ system.website_url }}/api/search/all',
      dataType: 'json',
      data: {term: query, limit: 40}
    }).then(data => (data?.results || []).map(item => {
      const systemClass = (item.system_class || '').replace(/_/g, ' ');
      return {
        id: String(item.id || '').split('/').pop(),
        label: item.name,
        info: systemClass.charAt(0).toUpperCase() + systemClass.slice(1),
        detail: item.description
      };
    }))
  });
</script>
