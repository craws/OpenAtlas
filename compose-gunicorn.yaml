services:
  postgres:
    image: "postgis/postgis:17-3.5"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=openatlas
#    ports:
#     - "25432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'PGPASSWORD=${POSTGRES_PASSWORD} psql -h localhost -U openatlas -d ${POSTGRES_DB} -c \\\\q'"]
      interval: 10s
      timeout: 5s
      retries: 30

  initdb:
    build:
      context: .
      dockerfile: install/container/Containerfile
    command: ["initdb"]
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=openatlas
    depends_on:
      postgres:
        condition: service_healthy

  openatlas-gunicorn:
    build:
      context: .
      dockerfile: install/container/Containerfile.gunicorn
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=openatlas
      - UV_DEV=${UV_DEV:-false}
    volumes:
      - openatlas-uploads:/var/www/openatlas/files/uploads
      - openatlas-resized:/var/www/openatlas/files/processed_images/resized
      - openatlas-export:/var/www/openatlas/files/export
      - openatlas-iiif-tests:/var/www/iipsrv/tests
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      initdb:
        condition: service_completed_successfully

  iiif:
    build:
      context: .
      dockerfile: install/container/Containerfile.iiif
    ports:
      - "8180:80"
    volumes:
      - openatlas-iiif-tests:/var/www/iipsrv/tests:ro
    depends_on:
      openatlas-gunicorn:
        condition: service_started

  openatlas-nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./install/container/nginx.gunicorn.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      openatlas-gunicorn:
        condition: service_started

  discovery:
    image: ghcr.io/acdh-oeaw/openatlas-discovery:develop
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_APP_BASE_URL=http://localhost:3000
      - NUXT_PUBLIC_API_BASE_URL=http://localhost:8081/api/
      - NUXT_PUBLIC_OPENAPI_BASE_URL=http://localhost:8081/openapi.json
      - NUXT_PUBLIC_DATABASE=enabled
      # - NUXT_PUBLIC_BOTS=enabled
      # - NUXT_PUBLIC_MAP_BASELAYER_URL_LIGHT=
      # - NUXT_PUBLIC_MAP_BASELAYER_URL_DARK=
      # - NUXT_PUBLIC_MAP_BASELAYER_ATTRIBUTION=
      # - NUXT_PUBLIC_MATOMO_BASE_URL=
      # - NUXT_PUBLIC_MATOMO_ID=
      # - NUXT_PUBLIC_REDMINE_ID=
    depends_on:
      openatlas-nginx:
        condition: service_started
    restart: unless-stopped

volumes:
  db-data:
  openatlas-uploads:
  openatlas-resized:
  openatlas-export:
  openatlas-iiif-tests: