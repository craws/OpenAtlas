{{- if eq .Values.postgis.deploy true -}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  annotations:
    helm.sh/resource-policy: keep
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}"
  name: {{ template "fullname" . }}-secret
data:
  {{- $secretName := printf "%s-secret" (include "fullname" .) -}}
  {{- $secret := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
  {{- if and $secret $secret.data (hasKey $secret.data "POSTGRES_PASSWORD") }}
  POSTGRES_PASSWORD: {{ index $secret.data "POSTGRES_PASSWORD" }}
  {{- else }}
  POSTGRES_PASSWORD: {{ .Values.postgis.password | default (randAlphaNum 16) | b64enc }}
  {{- end }}
{{- end -}}